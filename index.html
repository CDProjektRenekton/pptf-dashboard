<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psychological Pathways to Flourishing — Research Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#f7f5f0;
  --surface:#ffffff;
  --surface2:#f0ede8;
  --border:#e3dfd8;
  --text:#1a1814;
  --text2:#6b6660;
  --text3:#9e9890;
  --accent:#2d5a9e;
  --accent2:#e8401c;
  --accent3:#1a8c6b;
  --accent4:#c67c00;
  --r:12px;
  --rm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ── HEADER ─────────── */
.app-header{background:var(--text);color:#fff;padding:28px 32px 22px;position:relative;overflow:hidden}
.app-header::before{content:'';position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.04)}
.app-header::after{content:'';position:absolute;right:60px;bottom:-80px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.03)}
.header-label{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:6px}
.header-title{font-family:'DM Serif Display',serif;font-size:24px;line-height:1.2;color:#fff;max-width:540px}
.header-title em{font-style:italic;color:rgba(255,255,255,.75)}
.header-meta{margin-top:10px;font-size:12px;color:rgba(255,255,255,.45);display:flex;gap:20px;flex-wrap:wrap}
.header-actions{position:absolute;top:24px;right:28px;display:flex;gap:8px}
.icon-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rm);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:rgba(255,255,255,.75);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .18s}
.icon-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.icon-btn svg{flex-shrink:0}

/* ── STATUS BAR ─────────── */
.status-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.status-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;box-shadow:0 0 0 2px rgba(34,197,94,.2)}
.status-dot.loading{background:#f59e0b;animation:pulse 1s infinite}
.status-dot.error{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-text{font-size:12px;color:var(--text2)}
.status-time{font-size:11px;color:var(--text3);margin-left:auto}

/* ── MAIN LAYOUT ─────────── */
.main{padding:24px 32px;max-width:1100px}

/* ── KPI STRIP ─────────── */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--kpi-color,var(--accent))}
.kpi-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.kpi-val{font-size:26px;font-weight:300;color:var(--text);letter-spacing:-.02em;line-height:1}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* ── TABS ─────────── */
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tab{white-space:nowrap;flex-shrink:0;font-size:13px;font-family:'DM Sans',sans-serif;padding:8px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);cursor:pointer;margin-bottom:-1px;transition:all .15s;border-radius:var(--rm) var(--rm) 0 0}
.tab:hover{color:var(--text2);background:var(--surface2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500;background:var(--surface)}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ── SECTION HEADING ─────── */
.sec-head{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}

/* ── CARD ─────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:14px}
.card-note{font-size:11px;color:var(--text3);line-height:1.6;margin-top:10px}

/* ── CHART GRID ─────────── */
.chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:16px}
.chart-wrap{position:relative}

/* ── DONUT CARD ─────────── */
.donut-card{display:flex;flex-direction:column}
.donut-area{display:flex;align-items:center;gap:16px}
.donut-wrap{position:relative;width:120px;height:120px;flex-shrink:0}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut-center-val{font-size:18px;font-weight:300;color:var(--text)}
.donut-center-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px}
.legend-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.legend-lbl{color:var(--text2);flex:1}
.legend-n{font-weight:500;color:var(--text)}
.legend-pct{font-size:11px;color:var(--text3)}

/* ── BAR ITEMS ─────────── */
.bar-list{display:flex;flex-direction:column;gap:9px}
.bar-item{display:flex;align-items:center;gap:8px}
.bar-lbl{font-size:11px;color:var(--text2);width:130px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-lbl.wide{width:170px}
.bar-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-val{font-size:11px;font-weight:500;color:var(--text);min-width:36px;text-align:right}
.bar-count{font-size:10px;color:var(--text3);min-width:38px;text-align:right}

/* ── CORR GRID ─────────── */
.corr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.corr-cell{background:var(--surface2);border-radius:var(--r);padding:16px 18px;border-left:3px solid var(--corr-color,var(--border))}
.corr-r{font-size:28px;font-weight:300;letter-spacing:-.02em}
.corr-pairs{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.4}
.corr-interp{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}

/* ── DATA TABLE ─────────── */
.dtable-wrap{overflow-x:auto}
table.dtable{width:100%;border-collapse:collapse;font-size:12px}
table.dtable th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:500;text-align:left;padding:7px 10px;border-bottom:1px solid var(--border)}
table.dtable td{padding:8px 10px;border-bottom:1px solid var(--surface2);color:var(--text)}
table.dtable tr:last-child td{border-bottom:none}
table.dtable tr:hover td{background:var(--surface2)}

/* ── BADGE ─────────── */
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:500;letter-spacing:.02em}
.badge-green{background:#dcfce7;color:#166534}
.badge-amber{background:#fef9c3;color:#854d0e}
.badge-red{background:#fee2e2;color:#991b1b}

/* ── INDIVIDUAL SCORES TABLE ─────────── */
.ind-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ind-search{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--rm);font-size:13px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);outline:none}
.ind-search:focus{border-color:var(--accent)}
.ind-filter{padding:8px 12px;border:1px solid var(--border);border-radius:var(--rm);font-size:12px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text2);cursor:pointer;outline:none}
.ind-filter:focus{border-color:var(--accent)}
.ind-count{font-size:12px;color:var(--text3);margin-left:auto}
.ind-table-wrap{overflow-x:auto;border-radius:var(--rm);border:1px solid var(--border)}
table.ind-table{width:100%;border-collapse:collapse;font-size:12px;min-width:820px}
table.ind-table thead{position:sticky;top:0;z-index:2}
table.ind-table th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:600;text-align:left;padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
table.ind-table th:hover{color:var(--accent)}
table.ind-table th .sort-icon{margin-left:4px;opacity:.4}
table.ind-table th.sorted .sort-icon{opacity:1;color:var(--accent)}
table.ind-table td{padding:9px 12px;border-bottom:1px solid var(--surface2);color:var(--text);vertical-align:middle}
table.ind-table tr:last-child td{border-bottom:none}
table.ind-table tr:hover td{background:#faf9f7;cursor:pointer}
table.ind-table tr.expanded-row td{background:#f0f8ff}
.score-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500}
.score-num{font-weight:600;font-size:12px}
.met-num{font-size:11px;color:var(--text2)}

/* DETAIL PANEL */
.detail-row{display:none;background:#f5f9ff}
.detail-row.open{display:table-row}
.detail-cell{padding:16px 20px!important;border-bottom:1px solid var(--border)!important}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rm);padding:14px 16px}
.detail-card-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:600;margin-bottom:10px}
.detail-score-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.detail-score-lbl{font-size:11px;color:var(--text2)}
.detail-score-val{font-size:13px;font-weight:600;color:var(--text)}
.detail-bar-wrap{height:4px;background:var(--surface2);border-radius:2px;margin-bottom:8px;overflow:hidden}
.detail-bar{height:100%;border-radius:2px}
.detail-meta{font-size:11px;color:var(--text3);line-height:1.5;margin-top:6px;border-top:1px solid var(--surface2);padding-top:6px}
.detail-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px}
.detail-info-item{font-size:11px;color:var(--text2)}
.detail-info-item span{font-weight:500;color:var(--text)}
.no-results{padding:40px;text-align:center;color:var(--text3);font-size:13px}

/* ── LOADING ─────────── */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-label{font-size:13px;color:var(--text2)}

.error-state{padding:60px 32px;text-align:center;color:var(--text3)}
.error-state .err-ico{font-size:40px;margin-bottom:12px}
.error-state p{font-size:13px;color:var(--text2);margin-top:6px;max-width:380px;margin-inline:auto}

/* ── SCATTER PLACEHOLDER ── */
.scatter-ph{position:relative;height:240px}

/* ── FILTER BAR ─────────── */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:20px}
.fgroup{display:flex;flex-direction:column;gap:3px;min-width:130px}
.fgroup label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:500}
.fgroup select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--rm);font-size:12px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);cursor:pointer;outline:none}
.fgroup select:focus{border-color:var(--accent)}
.filter-count{font-size:12px;color:var(--text2);margin-left:auto;align-self:center}
.filter-count strong{color:var(--text);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rm);border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#244a83;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.inline-ctl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.inline-ctl select{padding:5px 8px;border:1px solid var(--border);border-radius:var(--rm);font-size:12px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);outline:none}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-head .card-title{margin-bottom:0}
.ctl-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ── PROGRESS ─────────── */
.progress{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--accent);border-radius:4px}
.stat-inline{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:12px}
.stat-inline div{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.stat-inline strong{display:block;font-size:20px;font-weight:300;color:var(--text);letter-spacing:-.01em;text-transform:none}

/* ── STATS / MATRIX ─────────── */
table.dtable td.num,table.dtable th.num{text-align:right;font-variant-numeric:tabular-nums}
table.dtable td.num{white-space:nowrap}
table.dtable tr.foot td{border-top:1px solid var(--border);background:var(--surface2);font-size:11px;color:var(--text2)}
table.matrix{border-collapse:separate;border-spacing:2px;font-size:12px;width:100%}
table.matrix th{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:6px;text-align:center;white-space:nowrap}
table.matrix th.rowh{text-align:left;text-transform:none;font-size:11px;color:var(--text2);letter-spacing:0}
table.matrix td{text-align:center;padding:8px 4px;border-radius:4px;font-variant-numeric:tabular-nums;color:var(--text);min-width:58px}
table.matrix td.diag{color:var(--text3);background:var(--surface2)}
.scale-legend{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text3);margin-top:10px}
.scale-legend .grad{width:160px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(232,64,28,.6),rgba(232,64,28,0) 50%,rgba(45,90,158,0) 50%,rgba(45,90,158,.6))}
.sig{color:var(--text2);font-size:10px;vertical-align:super}

/* ── CI ROWS (group comparisons) ─────────── */
.ci-list{display:flex;flex-direction:column;gap:10px}
.ci-row{display:grid;grid-template-columns:160px 1fr 150px;gap:10px;align-items:center;font-size:11px}
.ci-lbl{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-track{position:relative;height:18px;background:linear-gradient(var(--surface2),var(--surface2)) center/100% 2px no-repeat}
.ci-whisker{position:absolute;top:8px;height:2px;background:var(--accent);opacity:.55}
.ci-dot{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.ci-val{color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.ci-axis{display:grid;grid-template-columns:160px 1fr 150px;gap:10px;font-size:10px;color:var(--text3)}
.ci-axis div:nth-child(2){display:flex;justify-content:space-between}

/* ── MODEL ─────────── */
.path-svg{width:100%;max-width:680px;height:auto;display:block;margin:0 auto}
.path-svg rect{fill:var(--surface2);stroke:var(--border)}
.path-svg .box-t{font-size:13px;font-weight:600;fill:var(--text)}
.path-svg .box-s{font-size:10px;fill:var(--text3)}
.path-svg .coef{font-size:12px;font-weight:600;fill:var(--accent)}
.path-svg .coef-s{font-size:10px;fill:var(--text3)}
.path-svg line,.path-svg path{stroke:var(--text2);stroke-width:1.5;fill:none}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--rm);background:var(--surface2);margin-bottom:8px;font-size:12px;color:var(--text2)}
.verdict strong{color:var(--text)}
.verdict .vi{flex-shrink:0;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.vi.yes{background:#1a8c6b}.vi.no{background:#9e9890}
.boot-status{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:10px}
.mini-spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}

/* ── QUALITY ─────────── */
.flag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:999px;margin:1px 4px 1px 0;font-weight:500}
.flag.bad{background:#fee2e2;color:#991b1b}
.flag.warn{background:#fef9c3;color:#854d0e}
.flag-dot{display:inline-block;margin-left:6px;font-size:10px;padding:1px 6px;border-radius:999px;background:#fef9c3;color:#854d0e;font-weight:600}
.flag-dot.bad{background:#fee2e2;color:#991b1b}
.rule-list{font-size:12px;color:var(--text2);padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rule-list strong{color:var(--text)}
.empty-card{padding:40px;text-align:center;color:var(--text3);font-size:13px}

/* ── RESPONSIVE ─────────── */
@media(max-width:640px){
  .app-header{padding:20px 16px 16px}
  .header-actions{position:static;margin-top:12px}
  .main{padding:16px}
  .kpi-strip{grid-template-columns:repeat(2,1fr)}
  .status-bar{padding:10px 16px}
  .fgroup{min-width:calc(50% - 5px);flex:1}
  .ci-row,.ci-axis{grid-template-columns:90px 1fr 110px}
}
@media print{
  .header-actions,.filter-bar,.tabs,.ind-toolbar{display:none!important}
  .tab-pane{display:block!important}
  .app-header{background:#fff;color:#000}
  .card{break-inside:avoid}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-label">Research Dashboard · Mapúa University · 2026</div>
  <h1 class="header-title">Psychological Pathways to <em>Flourishing</em></h1>
  <div class="header-meta">
    <span>Jolina U. Villalobos, RPm</span>
    <span>N = <span id="hN">—</span> Filipino workers</span>
    <span>Instruments: IPAQ-SF · FS · MBI · MSPSS</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="exportCSV('all')" title="Download computed scores for all included respondents (CSV)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
      Export CSV
    </button>
    <button class="icon-btn" onclick="loadData()" title="Refresh data">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      Refresh
    </button>
  </div>
</header>

<div class="status-bar">
  <div class="status-dot loading" id="statusDot"></div>
  <div class="status-text" id="statusText">Connecting to Airtable…</div>
  <div class="status-time" id="statusTime"></div>
</div>

<div class="main" id="mainArea">
  <div class="loading-state">
    <div class="spinner"></div>
    <div class="loading-label">Fetching survey responses…</div>
  </div>
</div>

<script>
/* ── CONFIG ─────────────────────────────────────────────── */

function isDK(v){ return !!v && v!=='false' && v!=='No' && v!=='0' && v!==0; }
function quantile(sorted,q){ if(!sorted.length) return NaN; const p=(sorted.length-1)*q, lo=Math.floor(p), hi=Math.ceil(p); return sorted[lo]+(sorted[hi]-sorted[lo])*(p-lo); }

function pearsonRaw(xs,ys){
  const n=xs.length; if(n<3) return NaN;
  const mx=mean(xs), my=mean(ys); let num=0,dx2=0,dy2=0;
  for(let i=0;i<n;i++){ const a=xs[i]-mx, b=ys[i]-my; num+=a*b; dx2+=a*a; dy2+=b*b; }
  return (dx2&&dy2) ? num/Math.sqrt(dx2*dy2) : NaN;
}
function ranks(xs){
  const idx=xs.map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]); const r=new Array(xs.length);
  for(let i=0;i<idx.length;){ let j=i; while(j+1<idx.length && idx[j+1][0]===idx[i][0]) j++; const avg=(i+j)/2+1; for(let k=i;k<=j;k++) r[idx[k][1]]=avg; i=j+1; }
  return r;
}
function skewness(xs){ const n=xs.length; if(n<3) return NaN; const m=mean(xs), s=sd(xs); if(!s) return NaN; return n/((n-1)*(n-2))*xs.reduce((a,x)=>a+((x-m)/s)**3,0); }
function kurtosis(xs){ const n=xs.length; if(n<4) return NaN; const m=mean(xs), s=sd(xs); if(!s) return NaN;
  return n*(n+1)/((n-1)*(n-2)*(n-3))*xs.reduce((a,x)=>a+((x-m)/s)**4,0) - 3*(n-1)**2/((n-2)*(n-3)); }
function describe(xs){
  const n=xs.length; if(!n) return {n:0};

  return {n, min:s[0], max:s[n-1], mean:mean(xs), sd:sd(xs), median:quantile(s,.5), q1:quantile(s,.25), q3:quantile(s,.75), skew:skewness(xs), kurt:kurtosis(xs)};
}

/* incomplete beta → t / F distribution p-values */
function lgamma(x){
  const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x, tmp=x+5.5; tmp-=(x+0.5)*Math.log(tmp); let ser=1.000000000190015;
  for(let j=0;j<6;j++) ser+=c[j]/++y;
  return -tmp+Math.log(2.5066282746310005*ser/x);
}
function betacf(a,b,x){
  const FPMIN=1e-300; const qab=a+b,qap=a+1,qam=a-1; let c=1,d=1-qab*x/qap; if(Math.abs(d)<FPMIN) d=FPMIN; d=1/d; let h=d;
  for(let m=1;m<=300;m++){
    const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if(Math.abs(d)<FPMIN) d=FPMIN; c=1+aa/c; if(Math.abs(c)<FPMIN) c=FPMIN; d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if(Math.abs(d)<FPMIN) d=FPMIN; c=1+aa/c; if(Math.abs(c)<FPMIN) c=FPMIN; d=1/d;
    const del=d*c; h*=del; if(Math.abs(del-1)<3e-14) break;
  }
  return h;
}
function ibeta(x,a,b){
  if(x<=0) return 0; if(x>=1) return 1;
  const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return x<(a+1)/(a+b+2) ? bt*betacf(a,b,x)/a : 1-bt*betacf(b,a,1-x)/b;
}
const pT = (t,df) => (df>0&&isNum(t)) ? ibeta(df/(df+t*t),df/2,.5) : NaN;         // two-tailed
const pF = (F,d1,d2) => (isNum(F)&&F>0) ? ibeta(d2/(d2+d1*F),d2/2,d1/2) : (F===0?1:NaN);
function tCrit(df,alpha=.05){ let lo=0,hi=100; for(let i=0;i<80;i++){ const m=(lo+hi)/2; if(pT(m,df)>alpha) lo=m; else hi=m; } return (lo+hi)/2; }

function corrTest(rows,ga,gb,method){
  const xs=[],ys=[]; rows.forEach(r=>{ const a=ga(r), b=gb(r); if(isNum(a)&&isNum(b)){ xs.push(a); ys.push(b); } });
  const n=xs.length;
  const r = method==='spearman' ? pearsonRaw(ranks(xs),ranks(ys)) : pearsonRaw(xs,ys);
  const t = isNum(r) && Math.abs(r)<1 ? r*Math.sqrt((n-2)/(1-r*r)) : NaN;
  return {r, n, p: Math.abs(r)===1 ? 0 : pT(t,n-2), xs, ys};
}
function corrStrength(r){ const a=Math.abs(r); if(!isNum(a)) return '—'; if(a>=.5) return 'Strong'; if(a>=.3) return 'Moderate'; if(a>=.1) return 'Weak'; return 'Negligible'; }
function corrColor(r){ return r>=0.1?'#1a8c6b':r<=-0.1?'#e8401c':'#9e9890'; }

/* matrix inversion (Gauss-Jordan) and OLS */
function invert(A){
  const n=A.length, M=A.map((row,i)=>[...row,...Array.from({length:n},(_,j)=>i===j?1:0)]);
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    if(Math.abs(M[p][c])<1e-12) return null;
    [M[c],M[p]]=[M[p],M[c]];
    const d=M[c][c]; for(let j=0;j<2*n;j++) M[c][j]/=d;
    for(let r=0;r<n;r++) if(r!==c){ const f=M[r][c]; if(f) for(let j=0;j<2*n;j++) M[r][j]-=f*M[c][j]; }
  }
  return M.map(row=>row.slice(n));
}
/* y: array, X: array of predictor columns (no intercept), idx: optional resample indices */
function olsBeta(y,X,idx){
  const k=X.length+1, n=idx?idx.length:y.length;
  const XtX=Array.from({length:k},()=>new Array(k).fill(0)), Xty=new Array(k).fill(0), xi=new Array(k);
  for(let t=0;t<n;t++){
    const i=idx?idx[t]:t; xi[0]=1; for(let j=1;j<k;j++) xi[j]=X[j-1][i];
    for(let a=0;a<k;a++){ Xty[a]+=xi[a]*y[i]; for(let b=a;b<k;b++) XtX[a][b]+=xi[a]*xi[b]; }
  }
  for(let a=0;a<k;a++) for(let b=0;b<a;b++) XtX[a][b]=XtX[b][a];
  const inv=invert(XtX); if(!inv) return null;
  return {beta:inv.map(row=>row.reduce((s,v,j)=>s+v*Xty[j],0)), inv};
}
function ols(y,X){
  const fit=olsBeta(y,X); if(!fit) return null;
  const {beta,inv}=fit, n=y.length, k=beta.length, df=n-k;
  const my=mean(y); let sse=0,sst=0;
  for(let i=0;i<n;i++){ let yh=beta[0]; for(let j=1;j<k;j++) yh+=beta[j]*X[j-1][i]; sse+=(y[i]-yh)**2; sst+=(y[i]-my)**2; }
  const mse=sse/df, tc=tCrit(df);
  const se=inv.map((row,i)=>Math.sqrt(row[i]*mse));
  const coefs=beta.map((b,i)=>{ const t=b/se[i]; return {b,se:se[i],t,p:pT(t,df),lo:b-tc*se[i],hi:b+tc*se[i]}; });
  const R2=sst?1-sse/sst:NaN, F=((sst-sse)/(k-1))/mse;
  return {coefs, R2, F, df1:k-1, df2:df, pF:pF(F,k-1,df), cov:inv.map(row=>row.map(v=>v*mse)), sse, n};
}
function anova(groups){
  const gs=groups.filter(g=>g.length>=1), all=gs.flat(), N=all.length, k=gs.length;
  if(k<2||N-k<1) return null;
  const gm=mean(all); let ssb=0, ssw=0;
  gs.forEach(g=>{ const m=mean(g); ssb+=g.length*(m-gm)**2; g.forEach(x=>ssw+=(x-m)**2); });
  const df1=k-1, df2=N-k, F=(ssb/df1)/(ssw/df2);
  return {F, df1, df2, p:pF(F,df1,df2), eta2: ssb/(ssb+ssw)};
}
function cronbach(itemRows){
  const n=itemRows.length, k=itemRows[0]?.length||0;
  if(n<3||k<2) return null;
  const cols=Array.from({length:k},(_,j)=>itemRows.map(r=>r[j]));
  const tot=itemRows.map(r=>r.reduce((a,b)=>a+b,0));
  const alpha=(cs,ts)=>{ const tv=variance(ts); return tv>0 ? (cs.length/(cs.length-1))*(1-cs.reduce((s,c)=>s+variance(c),0)/tv) : NaN; };
  const items=cols.map((c,j)=>{
    const rest=tot.map((t,i)=>t-c[i]);
    return {mean:mean(c), sd:sd(c), rit:pearsonRaw(c,rest), aDel: k>2 ? alpha(cols.filter((_,jj)=>jj!==j),rest) : NaN};
  });
  return {n,k,alpha:alpha(cols,tot),items};
}
function alphaLabel(a){ if(!isNum(a)) return '—'; return a>=.9?'Excellent':a>=.8?'Good':a>=.7?'Acceptable':a>=.6?'Questionable':a>=.5?'Poor':'Unacceptable'; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ── SCORING (per thesis methodology) ─────────────────────── */
/* IPAQ-SF — Guidelines for Data Processing and Analysis (IPAQ Research Committee, 2005):
   - cases with "don't know"/missing duration on an active domain are excluded
   - cases whose walking+moderate+vigorous time exceeds 960 min/day are excluded
   - bouts < 10 min are recoded to 0; durations > 180 min/day are truncated to 180
   - categorical score uses the official High / Moderate / Low criteria */
function scoreIPAQ(f){
  const issues=[]; let truncated=false, shortBout=false;
  const dom=(dK,hK,mK,dkK,label)=>{
    let days=num(f[dK]) ?? 0;
    if(days<0||days>7){ issues.push(`${label} days out of range (${days})`); days=Math.min(7,Math.max(0,days)); }
    if(days===0) return {days:0,min:0,raw:0};
    if(isDK(f[dkK])){ issues.push(`${label} duration: "don't know"`); return {days,min:0,raw:0}; }
    const h=num(f[hK]), m=num(f[mK]);
    if(h===null&&m===null){ issues.push(`${label} duration missing`); return {days,min:0,raw:0}; }
    const raw=(h||0)*60+(m||0);
    return {days,min:raw,raw};
  };
  const v=dom('IPAQ_Q1_Vigorous_Days','IPAQ_Q2_Vigorous_Hours','IPAQ_Q2_Vigorous_Minutes','IPAQ_Q2_DK','Vigorous');
  const m=dom('IPAQ_Q3_Moderate_Days','IPAQ_Q4_Moderate_Hours','IPAQ_Q4_Moderate_Minutes','IPAQ_Q4_DK','Moderate');
  const w=dom('IPAQ_Q5_Walking_Days','IPAQ_Q6_Walking_Hours','IPAQ_Q6_Walking_Minutes','IPAQ_Q6_DK','Walking');
  if(v.raw+m.raw+w.raw>960) issues.push(`Activity time ${v.raw+m.raw+w.raw} min/day exceeds 960`);
  [v,m,w].forEach(a=>{
    if(a.min>0&&a.min<10){ a.min=0; a.days=0; shortBout=true; }
    else if(a.min===0) a.days=0;
    if(a.min>180){ a.min=180; truncated=true; }
  });
  const sh=num(f.IPAQ_Q7_Sitting_Hours), sm=num(f.IPAQ_Q7_Sitting_Minutes);
  const sitMin=(sh===null&&sm===null)||isDK(f.IPAQ_Q7_DK) ? null : (sh||0)*60+(sm||0);
  const vigMET=8.0*v.min*v.days, modMET=4.0*m.min*m.days, walkMET=3.3*w.min*w.days, total=vigMET+modMET+walkMET;
  const valid=issues.length===0;
  let level=null;
  if(valid){
    const days=v.days+m.days+w.days;
    if((v.days>=3&&vigMET>=1500)||(days>=7&&total>=3000)) level='High';
    else if((v.days>=3&&v.min>=20)||((m.min>=30?m.days:0)+(w.min>=30?w.days:0)>=5)||(days>=5&&total>=600)) level='Moderate';
    else level='Low';
  }
  return {valid,issues,truncated,shortBout,v,m,w,
    vigMET:Math.round(vigMET),modMET:Math.round(modMET),walkMET:Math.round(walkMET),
    met:valid?Math.round(total):null, level, sitMin};
}
function scoreScale(f,sc){
  const items=[]; let missing=0, oor=0;
  for(let i=1;i<=sc.k;i++){
    const v=num(f[sc.prefix+i]);
    if(v===null){ missing++; items.push(null); }
    else if(v<sc.min||v>sc.max||!Number.isInteger(v)){ oor++; items.push(null); }
    else items.push(v);
  }
  const issues=[];
  if(missing) issues.push(`${sc.abbr}: ${missing} item${missing>1?'s':''} unanswered`);
  if(oor) issues.push(`${sc.abbr}: ${oor} out-of-range value${oor>1?'s':''}`);
  return {items, total: issues.length?null:items.reduce((a,b)=>a+b,0), issues};
}
function mbiLevel(v)  { return !isNum(v)?null:v<=16?'Low':v<=26?'Moderate':'High'; }
function fsLevel(v)   { return !isNum(v)?null:v>=48?'High':v>=33?'Moderate':'Low'; }
function mspssLevel(avg){ return !isNum(avg)?null:avg>=5.5?'High':avg>=2.95?'Moderate':'Low'; }
function ageBand(a){ return !isNum(a)?null:a<25?'18–24':a<35?'25–34':a<45?'35–44':a<55?'45–54':'55+'; }

function buildRow(rec,idx){
  const f=rec.fields||{};
  const ip=scoreIPAQ(f), fsS=scoreScale(f,SCALES.fs), mbiS=scoreScale(f,SCALES.mbi), msS=scoreScale(f,SCALES.mspss);
  const subAvg=items=>items.every(i=>msS.items[i-1]!==null) ? items.reduce((s,i)=>s+msS.items[i-1],0)/items.length : null;
  const age=num(f.Age);
  const realName=(f.Full_Name||f.Consent_Name||'').toString().trim();
  const demo={}; DEMO.forEach(d=>{ const v=f[d.key]; demo[d.key]=(v===undefined||v===null||v==='')?null:String(v).trim(); });
  demo.ageBand=ageBand(age); demo.ipaqLevel=ip.level;
  const mspssA=isNum(msS.total)?msS.total/12:null;
  const row={
    idx, id:rec.id, created:rec.createdTime?new Date(rec.createdTime):null,
    name: realName||('Respondent '+(idx+1)), realName,
    age, demo, ipaq:ip, met:ip.met, ipaqLevel:ip.level, sitMin:ip.sitMin,
    fsItems:fsS.items, fs:fsS.total, fsLevel:fsLevel(fsS.total),
    mbiItems:mbiS.items, mbi:mbiS.total, mbiLevel:mbiLevel(mbiS.total),
    mspssItems:msS.items, mspssT:msS.total, mspssA, mspssLevel:mspssLevel(mspssA),
    so:subAvg(MSPSS_SUB.so), fam:subAvg(MSPSS_SUB.fam), fri:subAvg(MSPSS_SUB.fri),
    invalid:[...fsS.issues,...mbiS.issues,...msS.issues,...ip.issues.map(s=>'IPAQ: '+s)],
    warn:[],
  };
  const flat=a=>a.every(v=>v!==null)&&new Set(a).size===1;
  if(flat(row.fsItems)&&flat(row.mbiItems)&&flat(row.mspssItems)) row.warn.push('Straight-lining (identical answer on every item)');
  if(age===null) row.warn.push('Age missing');
  else if(age<18||age>70) row.warn.push(`Implausible age (${age})`);
  return row;
}
function markDuplicates(rows){
  const seen={};
  rows.forEach(r=>{ if(!r.realName) return; const k=r.realName.toLowerCase().replace(/\s+/g,' '); (seen[k]=seen[k]||[]).push(r); });
  Object.values(seen).forEach(g=>{ if(g.length>1) g.forEach(r=>r.warn.push(`Possible duplicate (${g.length} responses with this name)`)); });
}

async function fetchAll() {
  let records=[], offset=null;
  do {
    let url=`https://api.airtable.com/v0/${AT_BASE}/${encodeURIComponent(AT_TABLE)}?pageSize=100`;
    if(offset) url+=`&offset=${offset}`;
    const r = await fetch(url,{headers:{Authorization:`Bearer ${AT_TOKEN}`}});
    if(!r.ok){ let msg=`HTTP ${r.status}`; try{ const e=await r.json(); msg=e.error?.message||e.error?.type||msg; }catch(_){} throw new Error(msg); }
    const d=await r.json();
    records=records.concat(d.records);
    offset=d.offset||null;
  } while(offset);
  return records;
}

  Chart.defaults.color='#6b6660';
  Chart.defaults.animation.duration=350;
}
const GRID='rgba(0,0,0,.05)';
const charts={};
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }
function destroyAll(){ Object.keys(charts).forEach(destroyChart); }
function newChart(id,cfg){ destroyChart(id); const ctx=document.getElementById(id); if(!ctx||!window.Chart) return; charts[id]=new Chart(ctx,cfg); }

function makeDonut(id,data,colors,labels){
  const tot=data.reduce((a,b)=>a+b,0);
  newChart(id,{type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:2,borderColor:'#fff',hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.label+': '+c.raw+' ('+pct(c.raw,tot)+'%)'}}}}});
}
function makeHist(id,labels,data,colors,xTitle,tipTitle){
  newChart(id,{type:'bar',
    data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:{topLeft:3,topRight:3},borderSkipped:'bottom',categoryPercentage:1,barPercentage:.88}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>tipTitle?tipTitle(c[0].label):c[0].label,label:c=>' '+c.raw+' respondent'+(c.raw===1?'':'s')}}},
      scales:{x:{title:{display:!!xTitle,text:xTitle,font:{size:11}},grid:{display:false},ticks:{font:{size:10},autoSkip:true,maxRotation:0}},
              y:{beginAtZero:true,grid:{color:GRID},ticks:{font:{size:10},precision:0},title:{display:true,text:'Respondents',font:{size:11}}}}}});
}
function makeScatter(id,pts,line,xLabel,yLabel,xShort,yShort){
  const ds=[{type:'scatter',data:pts,backgroundColor:'rgba(45,90,158,.45)',pointRadius:4.5,pointHoverRadius:7,pointBorderWidth:1,pointBorderColor:'#fff',pointHitRadius:8,label:'Respondents'}];
  if(line) ds.push({type:'line',data:line,borderColor:'#1a1814',borderWidth:2,pointRadius:0,pointHitRadius:0,label:'OLS fit',fill:false});
  newChart(id,{type:'scatter',data:{datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},
      plugins:{legend:{display:false},tooltip:{filter:c=>c.datasetIndex===0,callbacks:{label:c=>`${xShort}: ${(+c.raw.x).toLocaleString(undefined,{maximumFractionDigits:2})}, ${yShort}: ${(+c.raw.y).toLocaleString(undefined,{maximumFractionDigits:2})}`}}},
      scales:{x:{title:{display:true,text:xLabel,font:{size:11}},grid:{color:GRID},ticks:{font:{size:10}}},
              y:{title:{display:true,text:yLabel,font:{size:11}},grid:{color:GRID},ticks:{font:{size:10}}}}}});
}

/* ── RENDER HELPERS ─────────────────────────────────────── */
function barList(items,maxCount,color,wide){
  return items.map(([lbl,v,total])=>{
    const pctW=Math.round(v/(maxCount||1)*100);
    return `<div class="bar-item">
      <div class="bar-lbl${wide?' wide':''}" title="${esc(lbl)}">${esc(lbl)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pctW}%;background:${color}"></div></div>
      <div class="bar-val">${r2(v)}</div>
      ${total!==undefined?`<div class="bar-count">(${pct(v,total)}%)</div>`:''}
    </div>`;
  }).join('');
}
function freqBars(freqObj,n,color,wide,order){
  const items=Object.entries(freqObj).sort(order?((a,b)=>order.indexOf(a[0])-order.indexOf(b[0])):((a,b)=>b[1]-a[1]));
  if(!items.length) return '<div class="card-note">No responses.</div>';
  const max=Math.max(...items.map(i=>i[1]));
  return `<div class="bar-list">${barList(items.map(([k,v])=>[k,v,n]),max,color,wide)}</div>`;
}
function scaleItemBars(means,labels,max,color){
  return `<div class="bar-list">${means.map((m,i)=>`<div class="bar-item">
    <div class="bar-lbl wide" title="${labels[i]}">${i+1}. ${labels[i]}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${isNum(m)?Math.round(m/max*100):0}%;background:${color}"></div></div>
    <div class="bar-val">${fx(m,2)}</div>
  </div>`).join('')}</div>`;
}
function badgeCls(level,invert){
  if(invert) return level==='High'?'badge-red':level==='Low'?'badge-green':'badge-amber';
  return level==='High'?'badge-green':level==='Low'?'badge-red':'badge-amber';
}
function levelBadge(level,invert){ return level ? `<span class="badge ${badgeCls(level,invert)}">${level}</span>` : '<span class="badge" style="background:var(--surface2);color:var(--text3)">n/a</span>'; }
function donutCard(id,title,f,n,legend,note){
  const tot=legend.reduce((s,l)=>s+(f[l.key]||0),0);
  return `<div class="card donut-card">
    <div class="card-title">${title}</div>
    <div class="donut-area">
      <div class="donut-wrap">
        <canvas id="${id}" width="120" height="120" role="img" aria-label="Doughnut: ${title}">${legend.map(l=>`${f[l.key]||0} ${l.key}`).join(', ')}</canvas>
        <div class="donut-center"><div class="donut-center-val">${tot}</div><div class="donut-center-lbl">scored</div></div>
      </div>
      <div class="donut-legend">${legend.map(l=>`<div class="legend-item"><div class="legend-swatch" style="background:${l.color}"></div><div class="legend-lbl">${l.label}</div><div class="legend-n">${f[l.key]||0}</div><div class="legend-pct">${pct(f[l.key]||0,tot)}%</div></div>`).join('')}
        ${tot<n?`<div class="legend-item"><div class="legend-swatch" style="background:var(--border)"></div><div class="legend-lbl">Not scorable</div><div class="legend-n">${n-tot}</div><div class="legend-pct"></div></div>`:''}
      </div>
    </div>
    <p class="card-note">${note}</p>
  </div>`;
}
const levelOrder=(inv)=>inv?[{key:'Low',color:LVL_GOOD},{key:'Moderate',color:LVL_MID},{key:'High',color:LVL_BAD}]:[{key:'High',color:LVL_GOOD},{key:'Moderate',color:LVL_MID},{key:'Low',color:LVL_BAD}];

const TABS=[
  ['overview','Overview'],['scales','Scale distributions'],['reliability','Reliability'],['demo','Demographics'],
  ['groups','Group comparisons'],['corr','Correlations & stats'],['model','Moderated mediation'],
  ['quality','Data quality'],['individual','Individual scores'],
];
function renderShell(){
  const opts=k=>[...new Set(state.rows.map(r=>r.demo[k]).filter(Boolean))].sort();
  const lbl=k=>DEMO.find(d=>d.key===k).label;
  document.getElementById('mainArea').innerHTML=`
  <div class="filter-bar" role="region" aria-label="Filters">
    <div class="fgroup"><label for="fQuality">Responses</label>
      <select id="fQuality" onchange="onFilter()">
        <option value="valid">Valid only (recommended)</option>
        <option value="strict">Valid, excluding suspicious</option>
        <option value="all">All responses</option>
      </select></div>
    ${FILTER_KEYS.map(k=>`<div class="fgroup"><label for="f_${k}">${lbl(k)}</label>
      <select id="f_${k}" onchange="onFilter()"><option value="">All</option>${opts(k).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`).join('')}
    <button class="btn" onclick="resetFilters()">Reset</button>
    <div class="filter-count" id="filterCount"></div>
  </div>
  <div class="kpi-strip" id="kpis"></div>
  <div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab${state.tab===k?' active':''}" role="tab" data-tab="${k}" onclick="switchTab('${k}')">${l}<span id="tabBadge-${k}"></span></button>`).join('')}</div>
  ${TABS.map(([k])=>`<div id="tab-${k}" class="tab-pane${state.tab===k?' active':''}" role="tabpanel"></div>`).join('')}`;
  document.getElementById('fQuality').value=state.quality;
  FILTER_KEYS.forEach(k=>{ const el=document.getElementById('f_'+k); if(el) el.value=state.filters[k]||''; });
}
function onFilter(){
  state.quality=document.getElementById('fQuality').value;
  FILTER_KEYS.forEach(k=>state.filters[k]=document.getElementById('f_'+k).value);
  renderContent();
}
function resetFilters(){
  state.quality='valid'; state.filters={};
  document.getElementById('fQuality').value='valid';
  FILTER_KEYS.forEach(k=>document.getElementById('f_'+k).value='');
  renderContent();
}
function switchTab(name){
  state.tab=name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.toggle('active',p.id==='tab-'+name));
  if(name==='model') ensureModel();
}

/* ══════════════════════════════════════════════════════════
   CONTENT (re-rendered when filters change)
══════════════════════════════════════════════════════════ */
function renderContent(){
  destroyAll();
  const rows=activeRows(), n=rows.length, N=state.rows.length;
  document.getElementById('hN').textContent=n;
  document.getElementById('filterCount').innerHTML=`Analyzing <strong>${n}</strong> of ${N} responses`;
  document.getElementById('statusText').textContent=`${N} responses loaded · ${n} included in analysis`;
  const nBad=state.rows.filter(r=>r.invalid.length).length, nWarn=state.rows.filter(r=>!r.invalid.length&&r.warn.length).length;
  document.getElementById('tabBadge-quality').innerHTML=nBad||nWarn?`<span class="flag-dot${nBad?' bad':''}">${nBad+nWarn}</span>`:'';
  renderKPIs(rows);
  const draw=[];
  if(!n){
    TABS.forEach(([k])=>{ if(k!=='quality') document.getElementById('tab-'+k).innerHTML=`<div class="card empty-card">${N?'No responses match the current filters.':'No survey responses have been collected yet.'}</div>`; });
  } else {
    draw.push(renderOverview(rows), renderScales(rows), renderReliability(rows), renderDemo(rows), renderGroups(rows), renderCorr(rows));
    renderModelPane();
    renderIndividualPane();
  }
  renderQuality();
  requestAnimationFrame(()=>draw.forEach(fn=>fn&&fn()));
  if(state.tab==='model') ensureModel();
}

function renderKPIs(rows){
  const n=rows.length, N=state.rows.length;
  const ages=vals(rows,r=>r.age), fs=vals(rows,r=>r.fs), mbi=vals(rows,r=>r.mbi), msp=vals(rows,r=>r.mspssT), met=vals(rows,r=>r.met);
  const dm=describe(met);
  const prog=Math.min(100,Math.round(N/TARGET_N*100));
  document.getElementById('kpis').innerHTML=`
    <div class="kpi" style="--kpi-color:#2d5a9e"><div class="kpi-label">Responses collected</div><div class="kpi-val">${N}</div><div class="kpi-sub">${prog}% of target ${TARGET_N}</div><div class="progress" role="progressbar" aria-valuenow="${N}" aria-valuemax="${TARGET_N}"><div class="progress-fill" style="width:${prog}%"></div></div></div>
    <div class="kpi" style="--kpi-color:#6b6660"><div class="kpi-label">Mean age</div><div class="kpi-val">${fx(mean(ages),1)}</div><div class="kpi-sub">years (SD = ${fx(sd(ages),1)})</div></div>
    <div class="kpi" style="--kpi-color:#1a8c6b"><div class="kpi-label">Avg flourishing</div><div class="kpi-val">${fx(mean(fs))}</div><div class="kpi-sub">SD = ${fx(sd(fs))} &nbsp;/ 56</div></div>
    <div class="kpi" style="--kpi-color:#e8401c"><div class="kpi-label">Avg burnout (EE)</div><div class="kpi-val">${fx(mean(mbi))}</div><div class="kpi-sub">SD = ${fx(sd(mbi))} &nbsp;/ 42</div></div>
    <div class="kpi" style="--kpi-color:#c67c00"><div class="kpi-label">Avg social support</div><div class="kpi-val">${fx(mean(msp))}</div><div class="kpi-sub">SD = ${fx(sd(msp))} &nbsp;/ 84</div></div>
    <div class="kpi" style="--kpi-color:#534AB7"><div class="kpi-label">Median MET-min/wk</div><div class="kpi-val">${fint(dm.median)}</div><div class="kpi-sub">mean ${fint(dm.mean)} · IPAQ-SF</div></div>`;
}

/* ── TAB: OVERVIEW ──────────────────────────────────────── */
function renderOverview(rows){
  const n=rows.length;
  const ipaqF=freq(rows.map(r=>r.ipaqLevel)), fsF=freq(rows.map(r=>r.fsLevel)), mbiF=freq(rows.map(r=>r.mbiLevel)), mspF=freq(rows.map(r=>r.mspssLevel));
  /* collection timeline uses every collected response */
  const dated=state.rows.filter(r=>r.created).sort((a,b)=>a.created-b.created);
  const dayKey=d=>d.toISOString().slice(0,10);
  const perDay={}; dated.forEach(r=>{ const k=dayKey(r.created); perDay[k]=(perDay[k]||0)+1; });
  let days=[], cum=[];
  if(dated.length){
    const start=new Date(dayKey(dated[0].created)), end=new Date(dayKey(new Date()>dated[dated.length-1].created?new Date():dated[dated.length-1].created));
    let c=0; for(let d=new Date(start); d<=end; d.setUTCDate(d.getUTCDate()+1)){ const k=dayKey(d); c+=perDay[k]||0; days.push(k); cum.push(c); }
  }
  const last7=dated.filter(r=>Date.now()-r.created<7*86400000).length;
  const elapsed=days.length||1, rate=dated.length/elapsed;
  const remaining=Math.max(0,TARGET_N-state.rows.length);
  const eta=remaining&&rate>0 ? new Date(Date.now()+remaining/Math.max(rate,last7/7||rate)*86400000) : null;

  const vOpts=sel=>Object.entries(VARS).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${v.label}</option>`).join('');

  document.getElementById('tab-overview').innerHTML=`
    <div class="chart-row">
      ${donutCard('cIPAQ','Physical activity level (IPAQ-SF)',ipaqF,n,[{key:'High',label:'High',color:LVL_GOOD},{key:'Moderate',label:'Moderate',color:LVL_MID},{key:'Low',label:'Low',color:LVL_BAD}],
        'Official IPAQ-SF categorical criteria (IPAQ Research Committee, 2005): High = vigorous ≥3 days & ≥1,500 MET-min/wk, or ≥7 days & ≥3,000; Moderate = ≥3 days vigorous ≥20 min, ≥5 days moderate/walking ≥30 min, or ≥5 days & ≥600; otherwise Low.')}
      ${donutCard('cFS','Flourishing Scale level (FS)',fsF,n,[{key:'High',label:'High ≥48',color:LVL_GOOD},{key:'Moderate',label:'Moderate 33–47',color:LVL_MID},{key:'Low',label:'Low &lt;33',color:LVL_BAD}],
        'Diener &amp; Biswas-Diener (2009) Flourishing Scale: 8 items, 1–7 Likert. Total range 8–56. High ≥48, Low &lt;33.')}
    </div>
    <div class="chart-row">
      ${donutCard('cMBI','Burnout — Emotional Exhaustion (MBI-EE)',mbiF,n,[{key:'Low',label:'Low ≤16',color:LVL_GOOD},{key:'Moderate',label:'Moderate 17–26',color:LVL_MID},{key:'High',label:'High ≥27',color:LVL_BAD}],
        'Maslach Burnout Inventory (Maslach &amp; Jackson, 1981) — 7 EE items, 0–6 frequency scale. Total range 0–42. Low ≤16, High ≥27.')}
      ${donutCard('cMSPSS','Perceived Social Support (MSPSS)',mspF,n,[{key:'High',label:'High avg ≥5.5',color:LVL_GOOD},{key:'Moderate',label:'Moderate 2.95–5.49',color:LVL_MID},{key:'Low',label:'Low &lt;2.95',color:LVL_BAD}],
        'MSPSS (Zimet et al., 1988) — 12 items across Family, Friends, and Significant Other subscales. Item avg classified by Dahlem et al. (1991) cutoffs.')}
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">Relationship explorer</div>
        <div class="ctl-row">
          <label class="inline-ctl">X <select id="scX" onchange="state.scatterX=this.value;drawScatter()">${vOpts(state.scatterX)}</select></label>
          <label class="inline-ctl">Y <select id="scY" onchange="state.scatterY=this.value;drawScatter()">${vOpts(state.scatterY)}</select></label>
        </div>
      </div>
      <div style="position:relative;height:300px"><canvas id="cScatter" role="img" aria-label="Scatter plot of the selected variables"></canvas></div>
      <p class="card-note" id="scatterNote"></p>
    </div>

    <div class="card">
      <div class="card-title">Data collection progress</div>
      <div class="stat-inline">
        <div>Collected<strong>${state.rows.length} / ${TARGET_N}</strong></div>
        <div>Last 7 days<strong>${last7}</strong></div>
        <div>Avg per day<strong>${fx(rate,1)}</strong></div>
        <div>Remaining<strong>${remaining}</strong></div>
        <div>Projected finish<strong>${remaining===0?'Target met':eta?eta.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—'}</strong></div>
      </div>
      ${days.length?`<div style="position:relative;height:200px"><canvas id="cTimeline" role="img" aria-label="Cumulative responses collected over time">${state.rows.length} responses collected</canvas></div>`:'<p class="card-note">Submission timestamps are not available.</p>'}
      <p class="card-note">Based on Airtable submission time of all collected responses (not affected by filters). Projection uses the last-7-day pace (or the overall average if no recent responses).</p>
    </div>`;

  return ()=>{
    makeDonut('cIPAQ',[ipaqF.High||0,ipaqF.Moderate||0,ipaqF.Low||0],[LVL_GOOD,LVL_MID,LVL_BAD],['High','Moderate','Low']);
    makeDonut('cFS',[fsF.High||0,fsF.Moderate||0,fsF.Low||0],[LVL_GOOD,LVL_MID,LVL_BAD],['High','Moderate','Low']);
    makeDonut('cMBI',[mbiF.Low||0,mbiF.Moderate||0,mbiF.High||0],[LVL_GOOD,LVL_MID,LVL_BAD],['Low','Moderate','High']);
    makeDonut('cMSPSS',[mspF.High||0,mspF.Moderate||0,mspF.Low||0],[LVL_GOOD,LVL_MID,LVL_BAD],['High','Moderate','Low']);
    drawScatter();
    if(days.length) newChart('cTimeline',{type:'line',
      data:{labels:days,datasets:[
        {label:'Collected',data:cum,borderColor:'#2d5a9e',backgroundColor:'rgba(45,90,158,.08)',fill:true,borderWidth:2,pointRadius:0,pointHitRadius:10,tension:.15},
        {label:'Target',data:days.map(()=>TARGET_N),borderColor:'#9e9890',borderWidth:1,borderDash:[4,4],pointRadius:0,pointHitRadius:0,fill:false}]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:12,font:{size:11}}},tooltip:{filter:c=>c.datasetIndex===0,callbacks:{label:c=>` ${c.raw} collected (+${perDay[c.label]||0} that day)`}}},
        scales:{x:{grid:{display:false},ticks:{font:{size:10},maxTicksLimit:8,maxRotation:0}},y:{beginAtZero:true,suggestedMax:TARGET_N,grid:{color:GRID},ticks:{font:{size:10}}}}}});
  };
}
function drawScatter(){
  const rows=activeRows(), X=VARS[state.scatterX], Y=VARS[state.scatterY];
  const t=corrTest(rows,X.get,Y.get,'pearson');
  const pts=t.xs.map((x,i)=>({x,y:t.ys[i]}));
  let line=null, slope=NaN;
  if(t.n>=3){ const fit=olsBeta(t.ys,[t.xs]); if(fit){ const [b0,b1]=fit.beta; slope=b1; const mn=Math.min(...t.xs), mx=Math.max(...t.xs); line=[{x:mn,y:b0+b1*mn},{x:mx,y:b0+b1*mx}]; } }
  makeScatter('cScatter',pts,line,X.label,Y.label,X.short,Y.short);
  const note=document.getElementById('scatterNote');
  if(note) note.innerHTML = t.n<3 ? 'Not enough paired observations.' :
    `Each point = one respondent (n = ${t.n}). Line = least-squares fit (slope = ${fb(slope,4)}). Pearson <em>r</em> = <strong>${fr(t.r)}</strong>, <em>p</em> ${fp(t.p).startsWith('<')?fp(t.p):'= '+fp(t.p)} — ${corrStrength(t.r).toLowerCase()} ${t.r>=0?'positive':'negative'} association${t.p<.05?' (significant at .05)':' (not significant at .05)'}.`;
}

/* ── TAB: SCALE DISTRIBUTIONS ───────────────────────────── */
function renderScales(rows){
  const defs=[
    {id:'hFS',  sc:SCALES.fs,   get:r=>r.fs,     level:fsLevel, inv:false},
    {id:'hMBI', sc:SCALES.mbi,  get:r=>r.mbi,    level:mbiLevel, inv:true},
    {id:'hMSP', sc:SCALES.mspss,get:r=>r.mspssT, level:t=>mspssLevel(t/12), inv:false},
  ];
  const lc=(lvl,inv)=>lvl==='Moderate'?LVL_MID:(lvl==='High')!==inv?LVL_GOOD:LVL_BAD;
  const itemMeans=(key,k)=>Array.from({length:k},(_,i)=>mean(rows.map(r=>r[key][i]).filter(isNum)));
  const stats=d=>{ const s=describe(vals(rows,d.get)); return `<div class="stat-inline">
      <div>n<strong>${s.n}</strong></div><div>Mean<strong>${fx(s.mean)}</strong></div><div>SD<strong>${fx(s.sd)}</strong></div>
      <div>Median<strong>${fx(s.median)}</strong></div><div>Range<strong>${s.n?s.min+'–'+s.max:'—'}</strong></div>
      <div>Skew<strong>${fx(s.skew,2)}</strong></div><div>Kurtosis<strong>${fx(s.kurt,2)}</strong></div></div>`; };
  const legend=inv=>`<div class="donut-legend" style="flex-direction:row;gap:14px;margin-top:8px">${levelOrder(inv).map(l=>`<div class="legend-item"><div class="legend-swatch" style="background:${l.color}"></div><div class="legend-lbl">${l.key}</div></div>`).join('')}</div>`;
  const met=describe(vals(rows,r=>r.met));
  const metBins=[...Array(12).keys()].map(i=>i*500);
  const metCounts=metBins.map((b,i)=>vals(rows,r=>r.met).filter(v=>i===11?v>=b:(v>=b&&v<b+500)).length);
  const sub=k=>describe(vals(rows,r=>r[k]));
  const items={fs:itemMeans('fsItems',8), mbi:itemMeans('mbiItems',7), mspss:itemMeans('mspssItems',12)};

  document.getElementById('tab-scales').innerHTML=`
    ${defs.map(d=>`<div class="card">
      <div class="card-title">${d.sc.name} — total score distribution</div>
      ${stats(d)}
      <div style="position:relative;height:200px"><canvas id="${d.id}" role="img" aria-label="Histogram of ${d.sc.abbr} total scores"></canvas></div>
      ${legend(d.inv)}
      <p class="card-note">Bars are coloured by the classification each total score falls into. Skewness and excess kurtosis within ±2 and ±7 are generally acceptable for regression-based analyses (West, Finch &amp; Curran, 1995).</p>
    </div>`).join('')}

    <div class="card">
      <div class="card-title">Physical activity (IPAQ-SF) — MET-min/wk distribution</div>
      <div class="stat-inline">
        <div>n<strong>${met.n}</strong></div><div>Mean<strong>${fint(met.mean)}</strong></div><div>SD<strong>${fint(met.sd)}</strong></div>
        <div>Median<strong>${fint(met.median)}</strong></div><div>IQR<strong>${fint(met.q1)}–${fint(met.q3)}</strong></div>
        <div>Skew<strong>${fx(met.skew,2)}</strong></div><div>Kurtosis<strong>${fx(met.kurt,2)}</strong></div></div>
      <div style="position:relative;height:200px"><canvas id="hMET" role="img" aria-label="Histogram of MET-minutes per week"></canvas></div>

function renderReliability(rows){

  const sets=[
    {name:'Flourishing Scale (FS)',k:8, res:cronbach(complete('fsItems')), labels:FS_LABELS, items:true},
    {name:'MBI — Emotional Exhaustion',k:7, res:cronbach(complete('mbiItems')), labels:MBI_LABELS, items:true},
    {name:'MSPSS — total',k:12, res:cronbach(complete('mspssItems')), labels:MSPSS_LABELS, items:true},
    {name:'MSPSS — Significant other',k:4, res:cronbach(subset('mspssItems',MSPSS_SUB.so)), sub:true},
    {name:'MSPSS — Family',k:4, res:cronbach(subset('mspssItems',MSPSS_SUB.fam)), sub:true},
    {name:'MSPSS — Friends',k:4, res:cronbach(subset('mspssItems',MSPSS_SUB.fri)), sub:true},

  const aBadge=a=>!isNum(a)?'':`<span class="badge ${a>=.7?'badge-green':a>=.6?'badge-amber':'badge-red'}">${alphaLabel(a)}</span>`;
  const itemTable=s=>{
    if(!s.res) return '<p class="card-note">Not enough complete responses.</p>';
    return `<div class="dtable-wrap"><table class="dtable">
      <thead><tr><th>#</th><th>Item</th><th class="num">Mean</th><th class="num">SD</th><th class="num">Corrected item–total r</th><th class="num">α if item deleted</th></tr></thead>

        <td style="color:var(--text3)">${i+1}</td><td>${s.labels[i]}</td>

        <td class="num">${fr(it.rit)} ${isNum(it.rit)&&it.rit<.3?'<span class="badge badge-amber">&lt; .30</span>':''}</td>
        <td class="num">${fr(it.aDel)} ${isNum(it.aDel)&&it.aDel>s.res.alpha+.005?'<span class="badge badge-amber">↑ α</span>':''}</td></tr>`).join('')}</tbody>
    </table></div>`;
  };
  document.getElementById('tab-reliability').innerHTML=`
    <div class="card">
      <div class="card-title">Internal consistency — Cronbach's α</div>
      <div class="dtable-wrap"><table class="dtable">
        <thead><tr><th>Scale</th><th class="num">Items</th><th class="num">n (complete)</th><th class="num">α</th><th>Interpretation</th></tr></thead>
        <tbody>${sets.map(s=>`<tr><td>${s.sub?'&nbsp;&nbsp;&nbsp;':''}${s.name}</td><td class="num">${s.k}</td><td class="num">${s.res?s.res.n:'—'}</td><td class="num"><strong>${fr(s.res?.alpha)}</strong></td><td>${aBadge(s.res?.alpha)}</td></tr>`).join('')}</tbody>
      </table></div>
      <p class="card-note">George &amp; Mallery (2003): α ≥ .9 excellent, ≥ .8 good, ≥ .7 acceptable, ≥ .6 questionable, ≥ .5 poor. Computed on respondents who answered every item of the scale. Report these values in the Instruments / Results section alongside the published reliabilities.</p>
    </div>
    ${sets.filter(s=>s.items).map(s=>`<div class="card">
      <div class="card-title">${s.name} — item analysis</div>
      ${itemTable(s)}

    </div>`).join('')}`;
  return null;
}

/* ── TAB: MODERATED MEDIATION (PROCESS Model 14) ────────── */
function modelData(){
  const tx=state.model.xMetric==='ln' ? v=>Math.log(v+1) : v=>v/1000;
  const d=activeRows().filter(r=>isNum(r.met)&&isNum(r.mbi)&&isNum(r.mspssT)&&isNum(r.fs));
  return {X:d.map(r=>tx(r.met)), M:d.map(r=>r.mbi), W:d.map(r=>r.mspssT), Y:d.map(r=>r.fs), ids:d.map(r=>r.id)};
}
function renderModelPane(){
  const md=state.model;
  document.getElementById('tab-model').innerHTML=`
    <div class="card">
      <div class="card-head">
        <div class="card-title">Moderated mediation — PROCESS Model 14 (preview)</div>
        <div class="ctl-row">
          <label class="inline-ctl">X metric <select onchange="state.model.xMetric=this.value;ensureModel(true)">
            <option value="k"${md.xMetric==='k'?' selected':''}>MET-min/wk ÷ 1,000</option>
            <option value="ln"${md.xMetric==='ln'?' selected':''}>ln(MET-min/wk + 1)</option></select></label>
          <label class="inline-ctl">Bootstrap <select onchange="state.model.boots=+this.value;ensureModel(true)">
            ${[1000,5000,10000].map(b=>`<option value="${b}"${md.boots===b?' selected':''}>${b.toLocaleString()} samples</option>`).join('')}</select></label>
        </div>
      </div>
      <p class="card-note" style="margin-top:0">X = physical activity (IPAQ-SF), M = burnout (MBI-EE), W = perceived social support (MSPSS total, moderating the M → Y path), Y = flourishing (FS). Listwise deletion; M and W mean-centred before forming the interaction; percentile bootstrap confidence intervals (seed fixed for reproducibility).</p>
      <div id="modelBody"><div class="boot-status"><div class="mini-spin"></div>Preparing model…</div></div>
    </div>`;
}
function ensureModel(force){
  const pane=document.getElementById('modelBody'); if(!pane) return;
  const d=modelData();
  const key=d.ids.join(',')+'|'+state.model.xMetric+'|'+state.model.boots;
  if(!force && state.model.key===key && state.model.result){ drawModel(state.model.result); return; }
  if(state.model.running && state.model.key===key) return;
  state.model.key=key; state.model.result=null; state.model.running=true;
  const token=++state.model.token;
  runModel(d,state.model.boots,p=>{ if(token!==state.model.token) return false;
      const el=document.getElementById('modelBody'); if(el) el.innerHTML=`<div class="boot-status"><div class="mini-spin"></div>Bootstrapping… ${Math.round(p*100)}%</div>`; return true; })
    .then(res=>{ if(token!==state.model.token) return; state.model.running=false; state.model.result=res; drawModel(res); });
}
function runModel(d,B,progress){
  return new Promise(resolve=>{
    const n=d.X.length;
    if(n<20){ resolve({error:`At least 20 complete cases are needed (currently ${n}).`}); return; }
    const mM=mean(d.M), mW=mean(d.W), sdW=sd(d.W), mX=mean(d.X);
    const Mc=d.M.map(v=>v-mM), Wc=d.W.map(v=>v-mW), MW=Mc.map((v,i)=>v*Wc[i]);
    const mModel=ols(d.M,[d.X]);
    const yModel=ols(d.Y,[d.X,Mc,Wc,MW]);
    const yNoInt=ols(d.Y,[d.X,Mc,Wc]);
    const total=ols(d.Y,[d.X]);
    if(!mModel||!yModel||!total){ resolve({error:'Model could not be estimated (singular design — check for constant variables).'}); return; }
    const a=mModel.coefs[1].b, b1=yModel.coefs[2].b, b3=yModel.coefs[4].b;
    const wMin=Math.min(...d.W), wMax=Math.max(...d.W);
    const wVals=[mW-sdW,mW,mW+sdW].map(w=>Math.max(wMin,Math.min(wMax,w)));
    const ind=w=>a*(b1+b3*(w-mW));
    /* conditional effect of M on Y (b1 + b3·wc) with analytic SE */
    const cov=yModel.cov, df=yModel.df2;
    const condB=wVals.map(w=>{ const wc=w-mW, e=b1+b3*wc, se=Math.sqrt(cov[2][2]+wc*wc*cov[4][4]+2*wc*cov[2][4]), t=e/se; return {w,e,se,t,p:pT(t,df),lo:e-tCrit(df)*se,hi:e+tCrit(df)*se}; });
    const dR2=yModel.R2-(yNoInt?yNoInt.R2:NaN), Fint=yModel.coefs[4].t**2;
    const rng=mulberry32(20260501), boot={ind:wVals.map(()=>[]),index:[]};
    const idx=new Array(n); let done=0;
    const step=()=>{
      const end=Math.min(B,done+250);
      for(;done<end;done++){
        for(let i=0;i<n;i++) idx[i]=Math.floor(rng()*n);
        const fm=olsBeta(d.M,[d.X],idx), fy=olsBeta(d.Y,[d.X,Mc,Wc,MW],idx);
        if(!fm||!fy) continue;
        const ab=fm.beta[1], bb1=fy.beta[2], bb3=fy.beta[4];
        wVals.forEach((w,j)=>boot.ind[j].push(ab*(bb1+bb3*(w-mW))));
        boot.index.push(ab*bb3);
      }
      if(done<B){ if(progress(done/B)===false) return; setTimeout(step,0); return; }
      const ci=arr=>{ const s=[...arr].sort((x,y)=>x-y); return {lo:quantile(s,.025),hi:quantile(s,.975),se:sd(arr)}; };
      resolve({n,B,mM,mW,sdW,mX,a,b1,b3,mModel,yModel,total,condB,dR2,Fint,pInt:pF(Fint,1,df),df,
        cond:wVals.map((w,j)=>({w,eff:ind(w),...ci(boot.ind[j])})), index:{eff:a*b3,...ci(boot.index)}, wMin, wMax,
        xLabel:state.model.xMetric==='ln'?'ln(MET+1)':'MET ÷ 1,000'});
    };
    setTimeout(step,0);
  });
}

      <ul class="rule-list">

        <li><span class="flag bad">Invalid</span> <strong>IPAQ “don't know” / missing duration</strong> on an active domain, or <strong>walking + moderate + vigorous time &gt; 960 min/day</strong> — excluded per IPAQ guidelines (2005).</li>
        <li><span class="flag warn">Suspicious</span> <strong>Straight-lining</strong> — identical answer on every FS, MBI and MSPSS item (contradictory, since MBI runs opposite to FS/MSPSS).</li>

      ${flagged.length?`<div class="dtable-wrap"><table class="dtable">
        <thead><tr><th>#</th><th>Respondent</th><th>Submitted</th><th>Issues</th><th>In analysis?</th></tr></thead>

      </table></div>`:'<p class="card-note">No issues detected — all responses passed screening.</p>'}
    </div>`;
}

function readIndFilters(){
  const s=state.ind;

const LVL_RANK={Low:0,Moderate:1,High:2};
function indRows(){
  const s=state.ind, q=s.q.toLowerCase();
  let data=activeRows().filter(d=>{
    const txt=[d.name,d.demo.Sex,d.demo.Work_Arrangement,d.demo.Sector,d.demo.Job_Position,d.demo.Tenure,d.demo.Physical_Activity_Level].join(' ').toLowerCase();
    return (!q||txt.includes(q)) && (!s.pa||d.ipaqLevel===s.pa) && (!s.fs||d.fsLevel===s.fs) && (!s.mbi||d.mbiLevel===s.mbi) && (!s.msp||d.mspssLevel===s.msp);
  });
  if(s.sortKey){
    const k=s.sortKey;
    const get=d=>k==='name'?d.name.toLowerCase():k==='sex'?(d.demo.Sex||'').toLowerCase():k.endsWith('Level')?(LVL_RANK[d[k]]??-1):(d[k]??-Infinity);
    data=[...data].sort((a,b)=>{ const av=get(a), bv=get(b); return av<bv?(s.asc?-1:1):av>bv?(s.asc?1:-1):0; });
  }
  return data;
}

        <div class="detail-card-title">&#128202; IPAQ-SF &#8212; Physical Activity</div>
        <div class="detail-score-row"><span class="detail-score-lbl">Total MET-min/wk</span><span class="detail-score-val">${v(d.met)}</span></div>
        <div class="detail-bar-wrap"><div class="detail-bar" style="width:${isNum(d.met)?Math.min(100,Math.round(d.met/6000*100)):0}%;background:#1a8c6b"></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11px;color:var(--text2);margin-bottom:6px">
          <span>Vigorous:</span><span style="font-weight:600;color:var(--text)">${ip.v.days} d × ${ip.v.min} min = ${ip.vigMET.toLocaleString()}</span>
          <span>Moderate:</span><span style="font-weight:600;color:var(--text)">${ip.m.days} d × ${ip.m.min} min = ${ip.modMET.toLocaleString()}</span>
          <span>Walking:</span><span style="font-weight:600;color:var(--text)">${ip.w.days} d × ${ip.w.min} min = ${ip.walkMET.toLocaleString()}</span>
          <span>Sitting time:</span><span style="font-weight:600;color:var(--text)">${isNum(d.sitMin)?d.sitMin+' min/day':'—'}</span>
        </div>
        <div class="detail-meta">Classification: ${levelBadge(d.ipaqLevel,false)}${ip.truncated?' · 180-min truncation applied':''}${ip.shortBout?' · &lt;10-min bout recoded':''}<br>High ≥3,000 MET-min/wk over 7 days (or vigorous ≥3 days &amp; ≥1,500) · Moderate ≥600 · Low otherwise</div>
      </div>
      <div class="detail-card">
        <div class="detail-card-title">&#127807; Flourishing Scale (FS)</div>
        <div class="detail-score-row"><span class="detail-score-lbl">Total score</span><span class="detail-score-val">${v(d.fs)} <span style="font-size:11px;font-weight:400;color:var(--text3)">/ 56</span></span></div>
        <div class="detail-bar-wrap"><div class="detail-bar" style="width:${isNum(d.fs)?Math.round(d.fs/56*100):0}%;background:#1a8c6b"></div></div>
        ${itemBars(d.fsItems,FS_LABELS,7,'#1a8c6b')}
        <div class="detail-meta">Classification: ${levelBadge(d.fsLevel,false)}<br>High ≥48 · Moderate 33–47 · Low &lt;33</div>
      </div>
      <div class="detail-card">
        <div class="detail-card-title">&#128293; MBI &#8212; Emotional Exhaustion</div>
        <div class="detail-score-row"><span class="detail-score-lbl">Total score</span><span class="detail-score-val">${v(d.mbi)} <span style="font-size:11px;font-weight:400;color:var(--text3)">/ 42</span></span></div>
        <div class="detail-bar-wrap"><div class="detail-bar" style="width:${isNum(d.mbi)?Math.round(d.mbi/42*100):0}%;background:#e8401c"></div></div>
        ${itemBars(d.mbiItems,MBI_LABELS,6,'#e8401c')}
        <div class="detail-meta">Classification: ${levelBadge(d.mbiLevel,true)}<br>Low ≤16 (healthy) · Moderate 17–26 · High ≥27 (severe burnout)</div>
      </div>
      <div class="detail-card">
        <div class="detail-card-title">&#129309; MSPSS &#8212; Social Support</div>
        <div class="detail-score-row"><span class="detail-score-lbl">Total score</span><span class="detail-score-val">${v(d.mspssT)} <span style="font-size:11px;font-weight:400;color:var(--text3)">/ 84</span></span></div>
        <div class="detail-bar-wrap"><div class="detail-bar" style="width:${isNum(d.mspssT)?Math.round(d.mspssT/84*100):0}%;background:#2d5a9e"></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:11px;color:var(--text2);margin-bottom:8px">
          <span>Sig. other avg:</span><span style="font-weight:600;color:var(--text)">${fx(d.so,2)}</span>
          <span>Family avg:</span><span style="font-weight:600;color:var(--text)">${fx(d.fam,2)}</span>
          <span>Friends avg:</span><span style="font-weight:600;color:var(--text)">${fx(d.fri,2)}</span>
          <span>Overall item avg:</span><span style="font-weight:600;color:var(--text)">${fx(d.mspssA,2)}</span>
        </div>
        ${itemBars(d.mspssItems,MSPSS_LABELS,7,'#2d5a9e')}
        <div class="detail-meta">Classification: ${levelBadge(d.mspssLevel,false)}<br>High avg ≥5.5 · Moderate 2.95–5.49 · Low &lt;2.95 (Dahlem et al., 1991)</div>
      </div>
      <div class="detail-card" style="grid-column:1/-1">
        <div class="detail-card-title">&#128100; Respondent profile</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px 16px;font-size:11px;color:var(--text2)">
          ${[['Age',d.age],['Sex',d.demo.Sex],['Civil status',d.demo.Civil_Status],['Work arrangement',d.demo.Work_Arrangement],['Work schedule',d.demo.Work_Schedule],['Sector',d.demo.Sector],['Position',d.demo.Job_Position],['Job type',d.demo.Job_Type],['Tenure',d.demo.Tenure],['Self-reported PA',d.demo.Physical_Activity_Level],['Submitted',d.created?d.created.toLocaleString():null]]
            .map(([k,val])=>`<span>${k}: <strong style="color:var(--text)">${esc(val??'—')}</strong></span>`).join('')}
        </div>
        ${flags.length?`<div class="detail-meta">${d.invalid.map(s=>`<span class="flag bad">${esc(s)}</span>`).join('')}${d.warn.map(s=>`<span class="flag warn">${esc(s)}</span>`).join('')}</div>`:''}
      </div>
    </div></td></tr>`;
    return `<tr id="row-${d.idx}" class="${isOpen?'expanded-row':''}" onclick="toggleDetail(${d.idx})" style="cursor:pointer">
      <td style="color:var(--text3)">${d.idx+1}</td>
      <td><strong>${esc(d.name)}</strong>${flags.length?`<span class="flag-dot${d.invalid.length?' bad':''}" title="${esc(flags.join('; '))}">⚑</span>`:''}</td>
      <td>${d.age??'—'}</td><td>${esc(d.demo.Sex??'—')}</td>
      <td><span class="score-num">${v(d.met)}</span></td><td>${levelBadge(d.ipaqLevel,false)}</td>
      <td><span class="score-num">${v(d.fs)}</span><span style="font-size:10px;color:var(--text3)"> /56</span></td><td>${levelBadge(d.fsLevel,false)}</td>
      <td><span class="score-num">${v(d.mbi)}</span><span style="font-size:10px;color:var(--text3)"> /42</span></td><td>${levelBadge(d.mbiLevel,true)}</td>
      <td><span class="score-num">${v(d.mspssT)}</span><span style="font-size:10px;color:var(--text3)"> /84</span></td><td>${levelBadge(d.mspssLevel,false)}</td>
      <td style="color:var(--text3);font-size:11px">${isOpen?'▼':'▶'}</td>
    </tr>${detail}`;
  }).join('');
}
function toggleDetail(idx){
  state.ind.open = state.ind.open===idx ? null : idx;
  document.querySelectorAll('#indTbody .detail-row').forEach(r=>r.classList.toggle('open',r.id==='detail-'+state.ind.open));
  document.querySelectorAll('#indTbody tr[id^="row-"]').forEach(r=>{
    const on=r.id==='row-'+state.ind.open; r.classList.toggle('expanded-row',on); r.lastElementChild.textContent=on?'▼':'▶';
  });
}

/* ── CSV EXPORT (SPSS / Excel ready) ────────────────────── */
function exportCSV(scope){
  const rows = scope==='table' ? indRows() : activeRows();
  if(!rows.length){ alert('No rows to export.'); return; }
  const names = scope==='table' && document.getElementById('expNames')?.checked;
  const cols=[
    ['Respondent',r=>r.idx+1],['Airtable_ID',r=>r.id],['Submitted',r=>r.created?r.created.toISOString():''],
    ...(names?[['Name',r=>r.realName]]:[]),
    ['Age',r=>r.age],...DEMO.filter(d=>!['ageBand','ipaqLevel'].includes(d.key)).map(d=>[d.key,r=>r.demo[d.key]]),
    ['IPAQ_Vig_Days',r=>r.ipaq.v.days],['IPAQ_Vig_Min',r=>r.ipaq.v.min],['IPAQ_Mod_Days',r=>r.ipaq.m.days],['IPAQ_Mod_Min',r=>r.ipaq.m.min],
    ['IPAQ_Walk_Days',r=>r.ipaq.w.days],['IPAQ_Walk_Min',r=>r.ipaq.w.min],
    ['MET_Vigorous',r=>r.ipaq.valid?r.ipaq.vigMET:''],['MET_Moderate',r=>r.ipaq.valid?r.ipaq.modMET:''],['MET_Walking',r=>r.ipaq.valid?r.ipaq.walkMET:''],
    ['MET_Total',r=>r.met],['IPAQ_Level',r=>r.ipaqLevel],['Sitting_Min_Day',r=>r.sitMin],
    ...FS_LABELS.map((_,i)=>['FS_Q'+(i+1),r=>r.fsItems[i]]),['FS_Total',r=>r.fs],['FS_Level',r=>r.fsLevel],
    ...MBI_LABELS.map((_,i)=>['MBI_Q'+(i+1),r=>r.mbiItems[i]]),['MBI_EE_Total',r=>r.mbi],['MBI_Level',r=>r.mbiLevel],
    ...MSPSS_LABELS.map((_,i)=>['MSPSS_Q'+(i+1),r=>r.mspssItems[i]]),['MSPSS_Total',r=>r.mspssT],['MSPSS_Avg',r=>isNum(r.mspssA)?+r.mspssA.toFixed(4):''],
    ['MSPSS_SigOther',r=>isNum(r.so)?+r.so.toFixed(4):''],['MSPSS_Family',r=>isNum(r.fam)?+r.fam.toFixed(4):''],['MSPSS_Friends',r=>isNum(r.fri)?+r.fri.toFixed(4):''],['MSPSS_Level',r=>r.mspssLevel],
    ['Flags',r=>[...r.invalid,...r.warn].join('; ')],
  ];
  const cellv=v=>{ if(v===null||v===undefined) return ''; const s=String(v); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const csv=[cols.map(c=>c[0]).join(','),...rows.map(r=>cols.map(c=>cellv(c[1](r))).join(','))].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`pptf-scores-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

/* ── LOAD ────────────────────────────────────────────────── */
async function loadData(){
  const dot=document.getElementById('statusDot');
  const stxt=document.getElementById('statusText');
  const stime=document.getElementById('statusTime');
  dot.className='status-dot loading';
  stxt.textContent='Fetching responses from Airtable…';
  stime.textContent='';
  destroyAll();
  document.getElementById('mainArea').innerHTML=`<div class="loading-state"><div class="spinner"></div><div class="loading-label">Loading survey data…</div></div>`;
  try {
    const records=await fetchAll();
    if(!window.Chart) throw new Error('Chart library failed to load — check your internet connection.');
    state.rows=records.map(buildRow);
    markDuplicates(state.rows);
    state.model.result=null; state.model.key=null; state.ind.open=null;
    dot.className='status-dot';
    stime.textContent='Last updated: '+new Date().toLocaleTimeString();
    renderShell();
    renderContent();
  } catch(e){
    dot.className='status-dot error';
    stxt.textContent='Error: '+e.message;
    document.getElementById('mainArea').innerHTML=`<div class="error-state"><div class="err-ico">⚠</div><div style="font-size:15px;color:var(--text)">Could not load data</div><p>${esc(e.message)}</p></div>`;
  }
}

loadData();
</script>
